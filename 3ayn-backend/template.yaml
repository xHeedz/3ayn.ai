AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 3ayn backend - Ask (Bedrock Nova Lite), Read (Textract), Find (Rekognition), Who/Enroll (Rekognition Faces), Speak (Polly)

Globals:
  Function:
    Runtime: java21
    MemorySize: 1024
    Timeout: 30
    CodeUri: bcknd/ThreeAynFunction
    Environment:
      Variables:
        MODEL_ID: global.amazon.nova-2-lite-v1:0
        FACE_COLLECTION: threeayn-faces
        PROFILES_TABLE: !Ref ProfilesTable
        POLLY_VOICE: Hala
        POLLY_ENGINE: neural

Resources:
  ThreeAynApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"

  # ---------------------------------------------------------------------------
  # Authentication (optional by design).
  #
  # 3ayn is an assistive device first: a blind user must never be locked out of
  # it by a forgotten password. Signing in is therefore OPTIONAL - guest
  # profiles keep working with no account. An account exists to link a wearer
  # to a named guardian and to sync across devices.
  #
  # Passwords are never stored or seen by us; Cognito handles hashing,
  # verification email, reset codes and lockout.
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: threeayn-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your 3ayn verification code"
        EmailMessage: "Your 3ayn verification code is {####}"

  # Public browser client: no secret (a secret cannot be kept in a web app).
  # USER_PASSWORD_AUTH is enabled so the single-file frontend can authenticate
  # over HTTPS without pulling in an SDK to implement SRP.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: threeayn-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ThreeAynProfiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: faceId
          AttributeType: S
      KeySchema:
        - AttributeName: faceId
          KeyType: HASH

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.AskHandler::handleRequest
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['bedrock:InvokeModel', 'bedrock:Converse']
              Resource: '*'
      Events:
        Ask:
          Type: Api
          Properties: {RestApiId: !Ref ThreeAynApi, Path: /ask, Method: post}

  ReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.ReadHandler::handleRequest
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['textract:DetectDocumentText']
              Resource: '*'
      Events:
        Read:
          Type: Api
          Properties: {RestApiId: !Ref ThreeAynApi, Path: /read, Method: post}

  FindFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.FindHandler::handleRequest
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['rekognition:DetectLabels']
              Resource: '*'
      Events:
        Find:
          Type: Api
          Properties: {RestApiId: !Ref ThreeAynApi, Path: /find, Method: post}

  WhoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.WhoHandler::handleRequest
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['rekognition:SearchFacesByImage']
              Resource: '*'
            - Effect: Allow
              Action: ['dynamodb:GetItem']
              Resource: !GetAtt ProfilesTable.Arn
      Events:
        Who:
          Type: Api
          Properties: {RestApiId: !Ref ThreeAynApi, Path: /who, Method: post}

  EnrollFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.EnrollHandler::handleRequest
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['rekognition:CreateCollection', 'rekognition:IndexFaces']
              Resource: '*'
            - Effect: Allow
              Action: ['dynamodb:PutItem']
              Resource: !GetAtt ProfilesTable.Arn
      Events:
        Enroll:
          Type: Api
          Properties: {RestApiId: !Ref ThreeAynApi, Path: /enroll, Method: post}

  SpeakFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.SpeakHandler::handleRequest
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['polly:SynthesizeSpeech']
              Resource: '*'
      Events:
        Speak:
          Type: Api
          Properties: {RestApiId: !Ref ThreeAynApi, Path: /speak, Method: post}

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ThreeAynUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.UserHandler::handleRequest
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:PutItem', 'dynamodb:GetItem']
              Resource: !GetAtt UsersTable.Arn
      Events:
        CreateUser:
          Type: Api
          Properties: {RestApiId: !Ref ThreeAynApi, Path: /user, Method: post}
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref ThreeAynApi
            Path: /user/{userId}
            Method: get

  WatchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ThreeAynWatch
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: watchId
          AttributeType: S
      KeySchema:
        - AttributeName: watchId
          KeyType: HASH

  WatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.threeayn.handlers.WatchHandler::handleRequest
      Environment:
        Variables:
          WATCH_TABLE: !Ref WatchTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:PutItem', 'dynamodb:GetItem']
              Resource: !GetAtt WatchTable.Arn
      Events:
        WatchStart:
          Type: Api
          Properties:
            RestApiId: !Ref ThreeAynApi
            Path: /watch/start
            Method: post
        WatchFrame:
          Type: Api
          Properties:
            RestApiId: !Ref ThreeAynApi
            Path: /watch/frame
            Method: post
        WatchStop:
          Type: Api
          Properties:
            RestApiId: !Ref ThreeAynApi
            Path: /watch/stop
            Method: post
        WatchGet:
          Type: Api
          Properties:
            RestApiId: !Ref ThreeAynApi
            Path: /watch/{watchId}
            Method: get

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${ThreeAynApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Paste this into Settings -> Account in the app
    Value: !Ref UserPoolClient
  CognitoRegion:
    Description: Paste this into Settings -> Account in the app
    Value: !Ref AWS::Region
